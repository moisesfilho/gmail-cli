---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  build:
    name: Build & Release
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "## Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Version:** \`${TAG}\`" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline --no-decorate "$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" \
            | while read line; do echo "- $line"; done >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
