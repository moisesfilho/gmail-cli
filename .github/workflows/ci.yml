---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Security (bandit)
        run: bandit -r src/gmail_cli/

      - name: Test with coverage
        run: pytest --cov=src/gmail_cli/ --cov-report=xml --cov-report=term-missing

      - name: Coverage gate
        run: |
          coverage=$(python -c "import xml.etree.ElementTree as ET; root=ET.parse('coverage.xml').getroot(); print(root.attrib['line-rate'])")
          pct=$(echo "$coverage * 100" | bc -l | xargs printf "%.1f")
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Line Coverage | ${pct}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          if (( $(echo "$coverage < 1.0" | bc -l) )); then
            echo "❌ Coverage ${pct}% — minimum required is 100%"
            exit 1
          fi
          echo "✅ Coverage ${pct}% — gate passed"

      - name: Test summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ✅ |" >> $GITHUB_STEP_SUMMARY
