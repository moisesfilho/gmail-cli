[project]
name = "gmail-cli"
version = "1.2.0-alpha"
description = "CLI para gerenciar funções do Gmail"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-mock>=3.0", "pytest-cov>=7.0"]
dev = ["ruff>=0.16", "mypy>=1.0", "bandit>=1.9"]

[project.scripts]
gmail = "gmail_cli.cli:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = ["src/gmail_cli/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "PL",       # pylint
    "RUF",      # ruff-specific
    "SIM",      # simplify
    "T20",      # print statements
    "PT",       # pytest
    "BLE",      # blind except
    "RSE",      # raise semantics
]
ignore = [
    "PLR2004",  # magic value comparisons
    "SIM115",   # open-file context manager
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
